<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMA — AI Image Studio | Login & Register</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5">

  <div class="container" style="max-width: 480px;">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="brand-gradient fs-1 mb-2">
        <i class="bi bi-stars"></i> LUMA
      </div>
      <p class="text-muted small">Distributed AI Image Generation Studio</p>
    </div>

    <!-- Auth Card -->
    <div class="glass-panel p-4 p-md-5">
      <!-- Tabs Navigation -->
      <ul class="nav nav-pills nav-fill mb-4" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-semibold" id="tab-login-tab" data-bs-toggle="pill" data-bs-target="#tab-login" type="button" role="tab">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-semibold" id="tab-register-tab" data-bs-toggle="pill" data-bs-target="#tab-register" type="button" role="tab">
            <i class="bi bi-person-plus me-1"></i> Register
          </button>
        </li>
      </ul>

      <div class="tab-content" id="authTabsContent">
        <!-- Login Tab -->
        <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
          <div id="loginError" class="text-danger small mb-3 text-center fw-medium"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="loginUsername" class="form-label">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="loginUsername" placeholder="Enter your username" required autocomplete="username">
              </div>
            </div>

            <div class="mb-4">
              <label for="loginPassword" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
              </div>
            </div>

            <button type="submit" class="btn btn-gradient w-100 py-2 fs-6">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>
        </div>

        <!-- Register Tab -->
        <div class="tab-pane fade" id="tab-register" role="tabpanel">
          <div id="registerAlert"></div>

          <form id="registerForm">
            <div class="mb-3">
              <label for="regUsername" class="form-label">Desired Username</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="regUsername" placeholder="Choose a unique username" required autocomplete="username">
              </div>
            </div>

            <div class="mb-3">
              <label for="regPassword" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="regPassword" placeholder="Create a strong password" required autocomplete="new-password">
              </div>
            </div>

            <div class="mb-4">
              <label for="regConfirmPassword" class="form-label">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-shield-check"></i></span>
                <input type="password" class="form-control" id="regConfirmPassword" placeholder="Repeat your password" required autocomplete="new-password">
              </div>
            </div>

            <button type="submit" class="btn btn-gradient w-100 py-2 fs-6">
              <i class="bi bi-person-plus me-2"></i>Create Account
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Node Architecture Indicator Footer -->
    <div class="text-center mt-4 text-dim small">
      <i class="bi bi-hdd-network me-1"></i> Node 1: Web & Reverse Proxy (192.168.1.10)
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application JS -->
  <script src="js/app.js"></script>
</body>
</html>
